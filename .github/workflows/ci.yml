name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            compiler: clang
            cc: clang-17
            cxx: clang++-17
          - os: macos-latest
            compiler: appleclang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      # Install newer compilers on Ubuntu
      - name: Install GCC 13 (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      - name: Install Clang 17 (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y clang-17

      # Configure
      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHAVOC_ENABLE_TESTS=ON
          -DHAVOC_NATIVE=OFF
          -DHAVOC_WERROR=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -B build
          -DHAVOC_ENABLE_TESTS=ON
          -DHAVOC_NATIVE=OFF

      # Build
      - name: Build
        run: cmake --build build --config Release --parallel

      # Test
      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure --parallel 4

      # Debug build with sanitizers (Linux GCC only, to keep CI fast)
      - name: Configure Debug + Sanitizers
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build-debug
          -DCMAKE_BUILD_TYPE=Debug
          -DHAVOC_ENABLE_TESTS=ON
          -DHAVOC_ENABLE_SANITIZERS=ON
          -DHAVOC_NATIVE=OFF
          -DHAVOC_WERROR=ON

      - name: Build Debug
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        run: cmake --build build-debug --config Debug --parallel

      # EverySearchParameterReachesTheSearch runs a full search per tunable
      # parameter. It costs ~53s in Release and over 20x that instrumented,
      # which would dominate this job. It is a coverage test, not a
      # memory-safety one, and the Release job above still runs it.
      - name: Test Debug (ASan + UBSan)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        working-directory: build-debug
        run: >
          ctest -C Debug --output-on-failure --parallel 4
          -E 'EverySearchParameterReachesTheSearch'

      # The unit tests drive the engine through its C++ interface, so they
      # cannot reach the UCI layer's own parsing. Every case in this corpus
      # crashed or hung a released build at some point. Run against the
      # sanitizer build so a surviving-but-corrupt case is still caught.
      #
      # ~70s wall clock, of which only ~30s is CPU -- most of it is waiting on
      # searches that must be given time to finish, because a "go" followed
      # immediately by "quit" aborts the search and looks like a hang.
      # The seed is fixed so a failure here is reproducible.
      - name: Fuzz UCI (ASan + UBSan)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        run: ./scripts/testing/fuzz-uci.sh build-debug/havoc 7

  # ThreadSanitizer needs its own build: it cannot be combined with ASan, and
  # the job above is already the long pole, so this runs in parallel instead of
  # being bolted onto it.
  #
  # Nothing else in CI can catch a data race. The unit tests drive the engine
  # through its C++ interface on one thread, so the shared transposition table,
  # the cross-thread node counters and the stop flag are never contended. Both
  # races found so far were invisible to the entire rest of the suite.
  thread-sanitizer:
    runs-on: ubuntu-latest
    name: ubuntu-latest / tsan

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13

      # RelWithDebInfo, not Debug: TSan is slow enough on its own, and the line
      # numbers in a race report are what matter, not the optimisation level.
      # Tests are off because this job runs searches, not the test suite.
      - name: Configure TSan
        env:
          CC: gcc-13
          CXX: g++-13
        run: >
          cmake -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DHAVOC_NATIVE=OFF
          -DHAVOC_WERROR=ON
          -DCMAKE_CXX_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread

      - name: Build TSan
        run: cmake --build build-tsan --parallel

      # "quick" keeps this to three searches, ~30s on a 4-core runner. The
      # heavier thread counts in "full" are for running locally on a machine
      # that actually has the cores to contend with.
      - name: Search under TSan
        run: ./scripts/testing/tsan-search.sh build-tsan/havoc quick
